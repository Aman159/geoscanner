<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subsurface X-Ray AR CAD Engine</title>
    <!-- Three.js and OrbitControls loaded via reliable open source mirrors -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, sans-serif; background-color: #000; }
        
        /* Camera background feed stays locked underneath */
        #camera-bg { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; pointer-events: none; }
        
        /* Transparent 3D interaction canvas layer */
        #canvas3d { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; }
        
        /* Command Box UI Overlay */
        #ui-overlay { position: absolute; top: 15px; left: 5%; width: 90%; z-index: 3; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); color: #fff; padding: 15px; border-radius: 12px; border: 2px solid #39ff14; box-shadow: 0 10px 25px rgba(0,0,0,0.5); box-sizing: border-box; }
        .title { color: #39ff14; font-weight: bold; text-transform: uppercase; font-size: 13px; margin-bottom: 8px; letter-spacing: 1px; text-align: center; }
        
        .control-group { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; }
        .tool-btn { flex: 1; background: #1e293b; border: 1px solid #475569; color: #fff; padding: 10px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 11px; text-transform: uppercase; transition: all 0.2s; }
        .tool-btn.active { background: #39ff14; color: #000; border-color: #39ff14; }
        
        .slider-container { margin-top: 10px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #94a3b8; }
        input[type=range] { flex: 1; margin-left: 10px; accent-color: #39ff14; }
        
        #instruction-tag { position: absolute; bottom: 20px; left: 5%; width: 90%; text-align: center; color: #fff; font-weight: 500; font-size: 11px; z-index: 3; pointer-events: none; text-shadow: 0 2px 4px rgba(0,0,0,0.9); }
    </style>
</head>
<body>

    <!-- Camera Feed Stream Layer -->
    <video id="camera-bg" autoplay playsinline muted></video>

    <!-- 3D Grid Overlay Graphics Viewport -->
    <div id="canvas3d"></div>

    <!-- Active Command HUD Control Panel -->
    <div id="ui-overlay">
        <div class="title">📡 Subsurface X-Ray AR Blueprint Engine</div>
        
        <div class="slider-container">
            <span>Target Depth:</span>
            <input type="range" id="depthSlider" min="0.5" max="5" step="0.5" value="1.5">
            <span id="depthVal" style="color:#39ff14; font-weight:bold; margin-left:5px;">-1.5m</span>
        </div>

        <div class="control-group">
            <button class="tool-btn active" id="btn-water" onclick="selectTool('water')">💧 Pipe</button>
            <button class="tool-btn" id="btn-electric" onclick="selectTool('electric')">⚡ Wire</button>
            <button class="tool-btn" id="btn-clear" onclick="clearDesign()" style="background:#7f1d1d; color:#fca5a5; border-color:#991b1b;">Reset Scan</button>
        </div>
    </div>

    <div id="instruction-tag">Tap tiles to drop 3D underground structures.<br>Drag with two fingers together to rotate or re-align your grid path.</div>

    <script>
        let scene, camera, renderer, controls;
        let gridPlane, raycaster, mouse;
        let selectedTool = 'water';
        
        const toolColors = { water: 0x00bfff, electric: 0xff3333 };
        const toolRadii = { water: 0.14, electric: 0.05 };

        // 1. Kickstart Asynchronous Camera Feed
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('camera-bg').srcObject = stream;
            } catch (err) {
                console.log("Webcam access restricted or device doesn't support background streaming.");
            }
        }

        // 2. Build Structural 3D CAD Grid Interface
        function init3dEngine() {
            const container = document.getElementById('canvas3d');
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 6, 8); // Setup down-looking tracking perspective

            // Alpha set to true allows camera background to shine underneath grid lines
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Orbit swiping perspective controls setup
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2.1; // Block camera from dipping completely under the floor grid

            // Lighting setups
            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const light = new THREE.DirectionalLight(0xffffff, 0.8);
            light.position.set(5, 10, 5);
            scene.add(light);

            // Neon reference grid representing your floor surface tiles
            const floorGridHelper = new THREE.GridHelper(10, 20, 0x39ff14, 0x475569);
            scene.add(floorGridHelper);

            // Mathematical calculation plane layer to catch screen tap intersections
            const planeGeo = new THREE.PlaneGeometry(10, 10);
            planeGeo.rotateX(-Math.PI / 2);
            gridPlane = new THREE.Mesh(planeGeo, new THREE.MeshBasicMaterial({ visible: false }));
            scene.add(gridPlane);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Setup Touch Listeners
            renderer.domElement.addEventListener('pointerdown', handleFloorTapPlacement);
            window.addEventListener('resize', onViewportResize);

            // Dynamic Slider Feedback Update Engine
            document.getElementById('depthSlider').addEventListener('input', (e) => {
                document.getElementById('depthVal').innerText = `-${parseFloat(e.target.value).toFixed(1)}m`;
            });

            // Fire main graphics render loops thread
            animateLoop();
        }

        // 3. Toolbar Option Selection Toggles
        function selectTool(toolType) {
            selectedTool = toolType;
            document.getElementById('btn-water').classList.remove('active');
            document.getElementById('btn-electric').classList.remove('active');
            document.getElementById(`btn-${toolType}`).classList.add('active');
        }

        // 4. Raycast Mesh Generation Factory: Draws segments below floor target pointer
        function handleFloorTapPlacement(event) {
            // Cancel creation if user is intentionally clicking slider/buttons up top
            if (event.clientY < 140 && event.clientX > window.innerWidth * 0.05 && event.clientX < window.innerWidth * 0.95) return;

            // Normalize coordinate spaces maps
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObject(gridPlane);

            if (hits.length > 0) {
                const targetPoint = hits[0].point;
                const setDepth = parseFloat(document.getElementById('depthSlider').value);

                // Instantiate 3D Horizontal Pipe segment mesh block
                const cylinderGeo = new THREE.CylinderGeometry(toolRadii[selectedTool], toolRadii[selectedTool], 1.2, 16);
                cylinderGeo.rotateZ(Math.PI / 2); // Rotate flat inside trench direction

                const cylinderMat = new THREE.MeshStandardMaterial({
                    color: toolColors[selectedTool],
                    metalness: 0.7,
                    roughness: 0.3
                });

                const pipeSegmentMesh = new THREE.Mesh(cylinderGeo, cylinderMat);
                // Position element down, deep inside the floor plane boundary
                pipeSegmentMesh.position.set(targetPoint.x, -setDepth, targetPoint.z);
                pipeSegmentMesh.userData = { isUserAsset: true };
                scene.add(pipeSegmentMesh);

                // Draw vertical layout laser tracing paths tying model to top tiles reference points
                const pathBufferGeo = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(targetPoint.x, 0, targetPoint.z),
                    new THREE.Vector3(targetPoint.x, -setDepth, targetPoint.z)
                ]);
                const lineMat = new THREE.LineDashedMaterial({ color: 0x39ff14, dashSize: 0.15, gapSize: 0.1 });
                const depthIndicatorAxisLine = new THREE.Line(pathBufferGeo, lineMat);
                depthIndicatorAxisLine.computeLineDistances();
                depthIndicatorAxisLine.userData = { isUserAsset: true };
                scene.add(depthIndicatorAxisLine);
            }
        }

        // 5. Reset Scene Map Caching Control
        function clearDesign() {
            const targetedAssets = [];
            scene.traverse((element) => {
                if (element.userData && element.userData.isUserAsset) {
                    targetedAssets.push(element);
                }
            });

            targetedAssets.forEach((itemMesh) => {
                scene.remove(itemMesh);
            });
        }

        // 6. Framing Systems Continuous Rendering Thread
        function animateLoop() {
            requestAnimationFrame(animateLoop);

            if (controls) {
                controls.update();
            }

            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        function onViewportResize() {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        // 7. Secure Complete Page Load Launch Sequence Hooks
        window.addEventListener('DOMContentLoaded', () => {
            startCamera();
            init3dEngine();
        });
