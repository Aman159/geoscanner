<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-Ray GeoScanner Pro</title>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <title>Subsurface 3D CAD Infrastructure Engine</title>
    <!-- Three.js for 3D engine and OrbitControls for touch rotation -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #000; user-select: none; }
        #camera-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        #canvas3d { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: auto; }
        #ui-overlay { position: absolute; bottom: 25px; left: 5%; width: 90%; z-index: 3; background: rgba(10, 15, 30, 0.85); backdrop-filter: blur(8px); border: 2px solid #39ff14; color: #fff; padding: 15px; border-radius: 12px; box-sizing: border-box; box-shadow: 0 0 20px rgba(57, 255, 20, 0.2); }
        .hud-title { color: #39ff14; font-weight: bold; text-transform: uppercase; font-size: 13px; margin-bottom: 10px; text-align: center; letter-spacing: 1px; }
        .data-row { display: flex; justify-content: space-between; font-size: 12px; margin: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 4px; }
        .val { color: #fff; font-weight: bold; }
        #scan-btn { background: #39ff14; color: #000; border: none; padding: 12px; font-weight: bold; border-radius: 6px; width: 100%; margin-top: 10px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 4px 10px rgba(57, 255, 20, 0.3); }
        #scan-btn:active { transform: scale(0.98); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, sans-serif; background-color: #0f172a; }
        #canvas3d { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* Designer UI HUD Layer */
        #ui-overlay { position: absolute; top: 15px; left: 5%; width: 90%; z-index: 2; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); color: #fff; padding: 15px; border-radius: 12px; border: 1px solid #39ff14; box-shadow: 0 10px 25px rgba(0,0,0,0.5); box-sizing: border-box; }
        .title { color: #39ff14; font-weight: bold; text-transform: uppercase; font-size: 13px; margin-bottom: 8px; letter-spacing: 1px; text-align: center;}
        
        /* Control Panel Toolbox */
        .control-group { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; }
        .tool-btn { flex: 1; background: #1e293b; border: 1px solid #475569; color: #fff; padding: 10px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 11px; text-transform: uppercase; transition: all 0.2s; }
        .tool-btn.active { background: #39ff14; color: #000; border-color: #39ff14; }
        
        .slider-container { margin-top: 10px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #94a3b8; }
        input[type=range] { flex: 1; margin-left: 10px; accent-color: #39ff14; }
        
        #instruction-tag { position: absolute; bottom: 20px; left: 5%; width: 90%; text-align: center; color: rgba(255,255,255,0.6); font-size: 11px; z-index: 2; pointer-events: none; }
    </style>
</head>
<body>

    <!-- Camera stream behind graphics -->
    <video id="camera-bg" autoplay playsinline muted></video>
    
    <!-- Three.js Graphics Container -->
    <!-- Target Renderer Viewport Canvas -->
    <div id="canvas3d"></div>

    <!-- Active Status HUD Overlay -->
    <!-- Subsurface Tool Control Panel -->
    <div id="ui-overlay">
        <div class="hud-title">📡 Subsurface Radar Engine Active</div>
        <div class="data-row"><span>Sensor Location:</span> <span class="val" id="gps-display">Awaiting Initialization</span></div>
        <div class="data-row"><span>Subsoil Strata:</span> <span class="val" id="rock-display" style="color:#ffcc00;">Idle</span></div>
        <div class="data-row"><span>Aquifer Water Table:</span> <span class="val" id="water-display" style="color:#38bdf8;">Idle</span></div>
        <div class="data-row"><span>Buried Conduits:</span> <span class="val" id="utility-display" style="color:#f87171;">Idle</span></div>
        <button id="scan-btn" onclick="initializeScanner()">Initialize Deep Scan</button>
        <div class="title">🛠️ Underground Structure Designer v1.0</div>
        
        <div class="slider-container">
            <span>Placement Depth:</span>
            <input type="range" id="depthSlider" min="1" max="5" step="0.5" value="2">
            <span id="depthVal" style="color:#39ff14; font-weight:bold; margin-left:5px;">-2.0m</span>
        </div>

        <div class="control-group">
            <button class="tool-btn active" id="btn-water" onclick="selectTool('water')">💧 Water Main</button>
            <button class="tool-btn" id="btn-electric" onclick="selectTool('electric')">⚡ Power Line</button>
            <button class="tool-btn" id="btn-clear" onclick="clearDesign()" style="background:#7f1d1d; color:#fca5a5; border-color:#991b1b;">Reset Grid</button>
        </div>
    </div>

    <script>
        let scene, camera, renderer, scanGroup;
        let waterLayer = null;
    <div id="instruction-tag">💻 Desktop: Left Click to build structures • Right Click to rotate grid.<br>📱 Mobile: Tap grid to build • Drag with two fingers to rotate scene perspective.</div>

        // 1. Core 3D Graphics Setup
        function init3DEngine() {
    <script>
        let scene, camera, renderer, controls;
        let gridPlane, raycaster, mouse;
        let selectedTool = 'water';
        
        // Setup internal component styles
        const toolColors = { water: 0x00bfff, electric: 0xff3333 };
        const toolRadii = { water: 0.12, electric: 0.05 };

        // 1. Initialize Visual Engine Frame
        function init() {
            const container = document.getElementById('canvas3d');
            scene = new THREE.Scene();
            
            scene.background = new THREE.Color(0x0f172a); // Deep layout slate tone

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 7);
            camera.position.set(0, 8, 10); // Elevated angle looking down onto the floor grid

            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Studio Lighting Setup
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            // Orbit controls hookup for complete structural finger swiping rotation
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2.1; // Limit angle so camera doesn't go below fake floor

            // Lighting Systems
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            // 2. Generate the "Floor Mesh" Representing Your Apartment Tiles
            // Floor Grid Helper (Simulates the surface level)
            const gridHelper = new THREE.GridHelper(10, 20, 0x39ff14, 0x334155);
            gridHelper.position.y = 0;
            scene.add(gridHelper);

            // Translucent Plane to catch mouse pointer calculation clicks
            const planeGeo = new THREE.PlaneGeometry(10, 10);
            planeGeo.rotateX(-Math.PI / 2);
            const planeMat = new THREE.MeshBasicMaterial({ visible: false });
            gridPlane = new THREE.Mesh(planeGeo, planeMat);
            scene.add(gridPlane);

            // Setup Raycasting structures to identify where finger coordinates tap on screen
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Event Listeners
            window.addEventListener('pointerdown', onGridClick);
            window.addEventListener('resize', onWindowResize);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7);
            scene.add(directionalLight);

            scanGroup = new THREE.Group();
            scene.add(scanGroup);
            // Depth Slider Listener
            document.getElementById('depthSlider').addEventListener('input', (e) => {
                document.getElementById('depthVal').innerText = `-${parseFloat(e.target.value).toFixed(1)}m`;
            });

            // Execute frame loops immediately
            animate();
        }

        // 2. Dynamic 3D Structural Mesh Builder
        function renderXRayStructures(rockColorHex) {
            // Safe removal loop to refresh structure geometry configurations
            while(scanGroup.children.length > 0) { 
                scanGroup.remove(scanGroup.children[0]); 
            }

            // Layer 1: Silt Topsoil Profile
            const topGeo = new THREE.CylinderGeometry(1.8, 1.85, 0.7, 32);
            const topMat = new THREE.MeshStandardMaterial({color: 0x5c4033, roughness: 0.9});
            const topSoil = new THREE.Mesh(topGeo, topMat);
            topSoil.position.y = 1.3;
            scanGroup.add(topSoil);

            // Layer 2: Translucent Water Table Aquifer Band
            const waterGeo = new THREE.CylinderGeometry(1.78, 1.78, 0.4, 32);
            const waterMat = new THREE.MeshStandardMaterial({
                color: 0x0ea5e9, 
                transparent: true, 
                opacity: 0.6,
                roughness: 0.2
            });
            waterLayer = new THREE.Mesh(waterGeo, waterMat);
            waterLayer.position.y = 0.65;
            scanGroup.add(waterLayer);

            // Layer 3: Solid Geological Bedrock Slabs
            const bedrockGeo = new THREE.CylinderGeometry(1.75, 1.6, 1.6, 32);
            const bedrockMat = new THREE.MeshStandardMaterial({color: rockColorHex, roughness: 0.95});
            const bedrock = new THREE.Mesh(bedrockGeo, bedrockMat);
            bedrock.position.y = -0.4;
            scanGroup.add(bedrock);

            // Utility Network: Horizontal Flow Infrastructures
            const pipeBlueGeo = new THREE.CylinderGeometry(0.12, 0.12, 3.8, 16);
            pipeBlueGeo.rotateZ(Math.PI / 2);
            const pipeBlueMat = new THREE.MeshStandardMaterial({color: 0x1d4ed8, metalness: 0.7, roughness: 0.3});
            const waterPipe = new THREE.Mesh(pipeBlueGeo, pipeBlueMat);
            waterPipe.position.set(0, 1.3, 0.4);
            scanGroup.add(waterPipe);

            const pipeRedGeo = new THREE.CylinderGeometry(0.05, 0.05, 3.8, 16);
            pipeRedGeo.rotateZ(Math.PI / 2.4);
            const pipeRedMat = new THREE.MeshStandardMaterial({color: 0xef4444, metalness: 0.6});
            const dataCable = new THREE.Mesh(pipeRedGeo, pipeRedMat);
            dataCable.position.set(0, 1.45, -0.3);
            scanGroup.add(dataCable);

            // Push into foreground alignment frame positions
            scanGroup.position.set(0, -1.2, -4);
            scanGroup.rotation.x = 0.5; 
        // 3. Toolbox Selection Interface Logic
        function selectTool(toolType) {
            selectedTool = toolType;
            document.getElementById('btn-water').classList.remove('active');
            document.getElementById('btn-electric').classList.remove('active');
            document.getElementById(`btn-${toolType}`).classList.add('active');
        }

        // 3. User Trigger System Controls
        function initializeScanner() {
            document.getElementById('scan-btn').innerText = "Scanning Subsurface...";
            
            // Activate Hardware Camera Streaming Infrastructure
            const video = document.getElementById('camera-bg');
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                    .then(stream => { 
                        video.srcObject = stream; 
                    })
                    .catch(err => {
                        console.log("Camera hardware bypassed or missing.");
                    });
        // 4. Raycasting Engine: Adds a 3D structural pipe right underneath your click location
        function onGridClick(event) {
            // Disable structure creation if interacting with overlay box controls
            if (event.clientY < 140 && event.clientX > window.innerWidth * 0.05 && event.clientX < window.innerWidth * 0.95) return;

            // Normalize coordinate system mapping vectors
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(gridPlane);

            if (intersects.length > 0) {
                const intersectPoint = intersects[0].point;
                const chosenDepth = parseFloat(document.getElementById('depthSlider').value);

                // Build a 3D Cylinder line structure (a pipeline segment)
                const segmentLength = 1.2;
                const pipeGeo = new THREE.CylinderGeometry(toolRadii[selectedTool], toolRadii[selectedTool], segmentLength, 16);
                pipeGeo.rotateZ(Math.PI / 2); // Align laying flat

                const pipeMat = new THREE.MeshStandardMaterial({
                    color: toolColors[selectedTool],
                    metalness: 0.7,
                    roughness: 0.2,
                    wireframe: false
                });

                const pipeSegment = new THREE.Mesh(pipeGeo, pipeMat);
                
                // Position object precisely where tap occurred, dropping it downwards based on slider meters value
                pipeSegment.position.set(intersectPoint.x, -chosenDepth, intersectPoint.z);
                
                // Add tag descriptor identifier variables to model group structure arrays
                pipeSegment.userData = { isStructure: true };
                scene.add(pipeSegment);

                // Add a matching warning dashed wire structure connecting it up to surface to visualize the underground layout connection path
                const lineGeo = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(intersectPoint.x, 0, intersectPoint.z),
                    new THREE.Vector3(intersectPoint.x, -chosenDepth, intersectPoint.z)
                ]);
                const lineMat = new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 0.2, gapSize: 0.1 });
                const indicatorLine = new THREE.Line(lineGeo, lineMat);
                indicatorLine.computeLineDistances();
                indicatorLine.userData = { isStructure: true };
                scene.add(indicatorLine);
            }

            // Immediately instantiate standard graphics block structure layers
            renderXRayStructures(0x475569);

            // Safety Fallback Trigger: Renders default baseline information if GPS fails indoors
            const safetyTimeout = setTimeout(() => {
                fallbackToSimulatedNetworkData();
            }, 3000);

            if (!navigator.geolocation) {
                clearTimeout(safetyTimeout);
                fallbackToSimulatedNetworkData();
                return;
            }

            navigator.geolocation.getCurrentPosition(async position => {
                clearTimeout(safetyTimeout);
                const lat = position.coords.latitude.toFixed(4);
                const lon = position.coords.longitude.toFixed(4);
                document.getElementById('gps-display').innerText = `${lat}° N, ${lon}° E`;

                queryFreeWebDatabases(lat, lon);
            }, err => {
                clearTimeout(safetyTimeout);
                fallbackToSimulatedNetworkData();
            }, { enableHighAccuracy: false, timeout: 5000 });
        }

        // 4. API Query Management Processes
        async function queryFreeWebDatabases(lat, lon) {
            let foundRock = "Sedimentary Siltstone Bedrock";
            let foundRockColor = 0x334155; 
            let utilityStatus = "Conduits Modeled Safely";

            try {
                const geoRes = await fetch(`https://macrostrat.org/api/v2/sections?lat=${lat}&lng=${lon}`);
                const geoData = await geoRes.json();
                if (geoData.success && geoData.success.data.length > 0) {
                    foundRock = geoData.success.data.name || "Dense Subsurface Rock Strata";
                    foundRockColor = 0x78350f; 
        // 5. Clean Screen Utility Routine
        function clearDesign() {
            const structuresToRemove = [];
            scene.traverse((child) => {
                if (child.userData && child.userData.isStructure) {
                    structuresToRemove.push(child);
                }
            } catch(e) {}

            try {
                const bbox = `${parseFloat(lat)-0.001},${parseFloat(lon)-0.001},${parseFloat(lat)+0.001},${parseFloat(lon)+0.001}`;
                const osmUrl = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(`[out:json];way["pipeline"](${bbox});out body;`)}`;
                const osmRes = await fetch(osmUrl);
                const osmData = await osmRes.json();
                if (osmData.elements && osmData.elements.length > 0) {
                    utilityStatus = "Public Infrastructure Lines Detected";
                }
            } catch(e) {}

            document.getElementById('rock-display').innerText = foundRock;
            document.getElementById('water-display').innerText = "Water Table Detected @ ~14.5m";
            document.getElementById('utility-display').innerText = utilityStatus;
            document.getElementById('scan-btn').innerText = "Rescan Subsurface";
            
            renderXRayStructures(foundRockColor);
        }

        // 5. GPS Hardware Warning Layer Routing
        function fallbackToSimulatedNetworkData() {
            document.getElementById('gps-display').innerText = "Triangulated (Indoor WiFi Mode)";
            document.getElementById('rock-display').innerText = "Dense Subsoil Silt Foundation";
            document.getElementById('water-display').innerText = "Aquifer Layer Detected @ 16m";
            document.getElementById('utility-display').innerText = "Domestic Utility Corridors Modeled";
            document.getElementById('scan-btn').innerText = "Rescan Subsurface";
            renderXRayStructures(0x3e2723); 
            });
            structuresToRemove.forEach(obj => scene.remove(obj));
        }

        // 6. Graphics Frame Rendering Routines
        // 6. Framing Thread Core Renderer
        function animate() {
            requestAnimationFrame(animate);
            
            if (scanGroup && scanGroup.children.length > 0) {
                scanGroup.rotation.y += 0.008;
            }

            if (waterLayer) {
                waterLayer.material.opacity = 0.4 + Math.sin(Date.now() * 0.002) * 0.15;
            }

            controls.update(); // Smooth view rotations
            renderer.render(scene, camera);
        }

        // Bootstrap rendering engine window environments
        init3DEngine();
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.addEventListener('resize', () => {
            if(camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
